# Required for AndroidX support (keep these)
android.useAndroidX=true
android.enableJetifier=true

# Increase Gradle daemon memory (Fix OutOfMemoryError)
org.gradle.jvmargs=-Xmx4096m -Dfile.encoding=UTF-8

# Optional Kotlin daemon heap size boost (if using Kotlin 1.8+)
kotlin.daemon.jvm.options=-Xmx2048m

# Enable parallel and on-demand project configuration
org.gradle.parallel=true
org.gradle.configureondemand=true 